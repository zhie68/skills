version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-skill-radar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_password
      POSTGRES_DB: agent_skill_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d agent_skill_radar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent-skill-radar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: agent-skill-radar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://radar:radar_password@postgres:5432/agent_skill_radar?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-heuristic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      DISCOVERY_CRON: ${DISCOVERY_CRON:-0 2 * * *}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: agent-skill-radar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
